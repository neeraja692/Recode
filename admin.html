<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #EDE8D0; 
      margin: 0;
      padding: 0;
    }

    .admin-container {
      display: flex;
      height: 100vh;
    }

   
    .sidebar {
      width: 250px;
      background: #333333;
      color: #ffffff;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.2);
    }
    .sidebar h2 {
      margin-bottom: 20px;
      font-size: 22px;
      border-bottom: 2px solid #555555;
      padding-bottom: 10px;
    }
    .sidebar p {
      margin-top: 10px;
      font-size: 14px;
    }

    
    .main {
      flex: 1;
      padding: 30px;
      background: #ffffff;
      overflow-y: auto;
    }
    .section {
      margin-bottom: 30px;
      background: #F9F6E8; 
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
    }
    .section h3 {
      margin-bottom: 15px;
      color: #333333;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }

   
    button {
      padding: 10px 15px;
      margin: 5px;
      background: #333333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    button:hover {
      background: #555555;
      transform: scale(1.05);
    }

  
    ul {
      list-style: none;
      padding: 0;
    }
 ul li {
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 8px;
      border-radius: 5px;
      box-shadow: 0px 2px 4px rgba(0,0,0,0.1);
    }

   
    #logs {
      background: #ffffff;
      padding: 10px;
      border-radius: 5px;
      min-height: 80px;
      font-size: 14px;
      color: #333333;
      box-shadow: inset 0px 2px 4px rgba(0,0,0,0.1);
      white-space: pre-line;
    }
  </style>
  </head>
<body>
  <div class="admin-container">
    
    <div class="sidebar">
      <h2>Admin Controls</h2>
      <p>Welcome, Admin 👑</p>
      <p>Manage rooms, users, and commands here.</p>
    </div>

    
    <div class="main">
      <div class="section">
        <h3>Room Management</h3>
        <button onclick="createRoom()">Create Room</button>
        <ul id="roomList">
          <li>Engineering Room <button onclick="deleteRoom()">Delete</button></li>
        </ul>
      </div>

      <div class="section">
        <h3>User Management</h3>
        <ul id="userList">
          <li>Priya Sharma - Member <button onclick="promoteUser()">Promote</button></li>
        </ul>
      </div>
       <div class="section">
        <h3>System Commands</h3>
        <button onclick="announce()">Announce</button>
        <button onclick="muteUser()">Mute User</button>
        <button onclick="shutdownRoom()">Shutdown Room</button>
      </div>

      <div class="section">
        <h3>Activity Logs</h3>
        <div id="logs">No activity yet...</div>
      </div>
    </div>
  </div>
<script>
  

function sendAction(actionText){

fetch("/admin_action",{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:"action="+encodeURIComponent(actionText)
})

document.getElementById("logs").innerText += "\n"+actionText;

}

function createRoom() {
alert("Room created!");
sendAction("Room created");
}

function deleteRoom() {
alert("Room deleted!");
sendAction("Room deleted");
}

function promoteUser() {
alert("User promoted!");
sendAction("User promoted");
}

function announce() {
alert("Announcement broadcasted!");
sendAction("Announcement broadcasted");
}

function muteUser() {
alert("User muted!");
sendAction("User muted");
}

function shutdownRoom() {
alert("Room shutdown!");
sendAction("Room shutdown");
}


    </script>
</body>
</html>
