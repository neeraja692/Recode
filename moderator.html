<!DOCTYPE html>
<html>
<head>
  <title>Moderator Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #EDE8D0; 
      margin: 0;
      padding: 0;
    }

    .moderator-container {
      display: flex;
      height: 100vh;
    }

    
    .sidebar {
      width: 250px;
      background: #333333;
      color: #ffffff;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.2);
    }
    .sidebar h2 {
      margin-bottom: 20px;
      font-size: 22px;
      border-bottom: 2px solid #555555;
    padding-bottom: 10px;
    }
    .sidebar p {
      margin-top: 10px;
      font-size: 14px;
    }

   
    .main {
      flex: 1;
      padding: 30px;
      background: #ffffff;
      overflow-y: auto;
    }
    .section {
      margin-bottom: 30px;
      background: #F9F6E8;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
    }
    .section h3 {
      margin-bottom: 15px;
      color: #333333;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }


    
    button {
      padding: 10px 15px;
      margin: 5px;
      background: #333333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    button:hover {
      background: #555555;
      transform: scale(1.05);
    }

   
    ul {
      list-style: none;
      padding: 0;
    }
    ul li {
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 8px;
      border-radius: 5px;
      box-shadow: 0px 2px 4px rgba(0,0,0,0.1);
    }

   
    #logs {
      background: #ffffff;
      padding: 10px;
      border-radius: 5px;
      min-height: 80px;
      font-size: 14px;
      color: #333333;
      box-shadow: inset 0px 2px 4px rgba(0,0,0,0.1);
      white-space: pre-line;
    }
   </style>
</head>
<body>
  <div class="moderator-container">
    
    <div class="sidebar">
      <h2>Moderator Controls</h2>
      <p>Welcome, Moderator 🛡️</p>
      <p>Manage rooms and moderate users.</p>
    </div>

        <div class="main">
      <div class="section">
        <h3>Room Management</h3>
        <button onclick="createRoom()">Create Room</button>
        <ul id="roomList">
          <li>Design Room <button onclick="renameRoom()">Rename</button></li>
        </ul>
      </div>

      <div class="section">
        <h3>User Moderation</h3>
        <ul id="userList">
          <li>Ravi Kumar - Member 
            <button onclick="muteUser()">Mute</button>
            <button onclick="approveUser()">Approve</button>
    </li>
        </ul>
      </div>

      <div class="section">
        <h3>Commands</h3>
        <button onclick="pinMessage()">Pin Message</button>
        <button onclick="clearChat()">Clear Chat</button>
      </div>

      <div class="section">
        <h3>Activity Logs</h3>
        <div id="logs">No activity yet...</div>
      </div>
    </div>
  </div>

  <script>
    function createRoom() {
      alert("Room created!");
      document.getElementById("logs").innerText += "\nRoom created.";
    }
    function renameRoom() {
      alert("Room renamed!");
      document.getElementById("logs").innerText += "\nRoom renamed.";
    }
    function muteUser() {
      alert("User muted!");
      document.getElementById("logs").innerText += "\nUser muted.";
    }
  function approveUser() {
      alert("User approved!");
      document.getElementById("logs").innerText += "\nUser approved.";
    }
    function pinMessage() {
      alert("Message pinned!");
      document.getElementById("logs").innerText += "\nMessage pinned.";
    }
    function clearChat() {
      alert("Chat cleared!");
      document.getElementById("logs").innerText += "\nChat cleared.";
    }
  </script>
</body>
</html>
