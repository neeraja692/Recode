<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecureComm Cover Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #EDE8D0; 
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cover-container {
      text-align: center;
      background: #F9F6E8; 
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      animation: fadeIn 1.5s ease;
      max-width: 500px;
      width: 90%;
    }

.logo {
      width: 150px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      font-size: 32px;
      color: #333333;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    p {
      font-size: 16px;
      color: #555555;
      margin-bottom: 30px;
    }

    .start-btn {
      background: #333333; 
      color: #fff;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
 transition: all 0.3s ease;
    }
    .logo {
  width: 180px;
  height: auto;
  object-fit: contain;
  image-rendering: crisp-edges;
  filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));
}


    .start-btn:hover {
      background: #555555;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="cover-container">
    
    <img src="https://th.bing.com/th/id/OIP.wi1Aiev4zt_Ub_7wlrekkAHaE8?w=266&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="SecureComm Logo" class="logo">

    <h1>SECURECOMM</h1>
    <p>Empowering secure communication with cutting-edge technology.</p>
    <button class="start-btn" onclick="location.href='signup.html'">Start</button>
  </div>
</body>
</html>
