<!DOCTYPE html>
<html>
<head>
  <title>Follow & Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #EDE8D0;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 25%;
      background: #ffffff;
      border-right: 1px solid #ccc;
      padding: 20px;
      overflow-y: auto;
    }

    .sidebar h2 { margin-top: 0; color: #333; }
    .profile {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 15px; padding: 10px; border-radius: 8px; background-color: #fafafa;
    }
    .profile img { height: 40px; width: 40px; border-radius: 50%; margin-right: 10px; }
    .profile-info { flex-grow: 1; }
    .profile-info p { margin: 0; font-size: 14px; }
    .button { background-color: #333; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 14px; }
    .button:hover { background-color: #555; }

    .room { margin-top: 30px; padding: 15px; background-color: #f0f0f0; border-radius: 8px; }
    .room h3 { margin: 0 0 10px 0; color: #333; }
    .room p { margin: 5px 0; font-size: 14px; color: #555; }
    .room button { background-color: #333; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; }
    .room button:hover { background-color: #555; }

    .chat-area { flex-grow: 1; display: flex; flex-direction: column; }
    .chat-header { background-color: #333; color: white; padding: 15px; font-weight: bold; display:flex; justify-content:space-between; align-items:center; }
    .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; background-color: #fafafa; display: flex; flex-direction: column; gap: 10px; }
    .message { padding: 10px; border-radius: 8px; max-width: 60%; }
    .message.user { background-color: #d1e7dd; align-self: flex-end; }
    .message.other { background-color: #f8d7da; align-self: flex-start; }

    .chat-input { display: flex; border-top: 1px solid #ccc; padding: 10px; background: #fff; }
    .chat-input input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .chat-input button { background-color: #333; color: white; border: none; padding: 10px 15px; margin-left: 10px; border-radius: 5px; cursor: pointer; }
    .chat-input button:hover { background-color: #555; }

    .explore { flex-grow: 1; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #777; }
  </style>
</head>
<body>
 
  <div class="sidebar">
    <h2>Follow Pages</h2>
    <div class="profile">
      <img src="https://th.bing.com/th/id/OIP.cW0wzJYojHH-xxW35Wj7dQHaHa?w=165&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="Sarah Johnson">
      <div class="profile-info">
        <p><strong>Sarah Johnson</strong></p>
        <p>Marketing Manager</p>
      </div>
      <button class="button" onclick="followUser(this, 'Sarah Johnson')">Follow</button>
    </div>

    <div class="profile">
      <img src="https://th.bing.com/th/id/OIP.yVE7IEfMCCLjbFeiJKBJgQHaHa?w=185&h=185&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="David Lee">
      <div class="profile-info">
        <p><strong>David Lee</strong></p>
        <p>Software Engineer</p>
      </div>
      <button class="button" onclick="followUser(this, 'David Lee')">Follow</button>
    </div>

    <div class="profile">
      <img src="https://th.bing.com/th/id/OIP.u75hl7wWgFu5kCflv9sbMgHaHa?w=158&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="Priya Sharma">
      <div class="profile-info">
        <p><strong>Priya Sharma</strong></p>
        <p>Product Designer</p>
      </div>
      <button class="button" onclick="followUser(this, 'Priya Sharma')">Follow</button>
    </div>
    <div class="room">
      <h3>Room: AI Technology</h3>
      <p>💬 Chat ongoing...</p>
      <p>👥 30 people joined</p>
      <button id="joinBtn" onclick="joinRoom()">Join</button>
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="explore">Explore</div>
  </div>

  <script>
    function followUser(button, name) {
      button.textContent = "Followed";
      button.disabled = true;

      document.getElementById("chatArea").innerHTML = `
        <div class="chat-header">Chat with ${name}</div>
        <div class="chat-messages" id="messages">
          <div class="message other"><strong>${name}:</strong> Welcome to my page!</div>
          <div class="message user"><strong>You:</strong> Hi ${name}, glad to connect.</div>
        </div>
        <div class="chat-input">
          <input type="text" id="chatInput" placeholder="Type a message..." required>
          <button onclick="sendMessage('${name}')">Send</button>
        </div>
      `;
    }

    function joinRoom() {
      // Change button text to show joined
      const joinBtn = document.getElementById("joinBtn");
      joinBtn.textContent = "Joined";
      joinBtn.disabled = true;

      document.getElementById("chatArea").innerHTML = `
        <div class="chat-header">
          Room: Manju Patil
          <button onclick="exitGroup()" style="background:#fff;color:#333;border:1px solid #ccc;padding:5px 10px;border-radius:5px;cursor:pointer;">Exit</button>
        </div>
        <div class="chat-messages" id="messages">
          <div class="message other"><strong>Manju:</strong> Welcome everyone!</div>
          <div class="message other"><strong>Priya:</strong> Hi all!</div>
          <div class="message user"><strong>You:</strong> Glad to join the group.</div>
        </div>
        <div class="chat-input">
          <input type="text" id="chatInput" placeholder="Type a message..." required>
          <button onclick="sendMessage('Group')">Send</button>
        </div>
      `;
    }

    function exitGroup() {
      document.getElementById("chatArea").innerHTML = `<div class="explore">Explore</div>`;
      const joinBtn = document.getElementById("joinBtn");
      joinBtn.textContent = "Join";
      joinBtn.disabled = false;
    }

    function sendMessage(name) {
      const input = document.getElementById("chatInput");
      const messageText = input.value.trim();
      if (messageText !== "") {
        const messagesDiv = document.getElementById("messages");
        const newMessage = document.createElement("div");
        newMessage.className = "message user";
        newMessage.innerHTML = `<strong>You:</strong> ${messageText}`;
        messagesDiv.appendChild(newMessage);
        input.value = "";
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    }
  </script>
</body>
</html>
